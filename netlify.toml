[build]
  command = "npm run build"
  publish = "dist"

[headers]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"

  for = "/assets/*"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  for = "/*.webp"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  for = "/*.png"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  for = "/*.svg"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  for = "/favicon.ico"
    [headers.values]
      Cache-Control = "public, max-age=604800"

  for = "/robots.txt"
    [headers.values]
      Cache-Control = "public, max-age=86400"

  for = "/sitemap.xml"
    [headers.values]
      Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/photography"
  to = "/photography/"
  status = 301

[[redirects]]
  from = "/photography.html"
  to = "/photography/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
