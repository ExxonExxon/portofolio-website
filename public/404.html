<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Page not found | Tomas Gorjux</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fafaf9;
        color: #262626;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        border-radius: 2.5rem;
        border: 1px solid #e5e5e5;
        background-color: #ffffff;
        padding: 3rem 2rem;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        transition:
          background-color 0.3s,
          border-color 0.3s;
      }

      .code {
        font-size: 4rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: #171717;
        margin: 0 0 0.5rem;
        line-height: 1.1;
      }

      .code span {
        color: #6366f1;
      }

      .heading {
        font-size: 1.25rem;
        font-weight: 700;
        color: #171717;
        margin: 0 0 0.75rem;
      }

      .text {
        font-size: 1rem;
        line-height: 1.6;
        color: #737373;
        margin: 0 0 2rem;
      }

      .link {
        display: inline-flex;
        align-items: center;
        border-radius: 9999px;
        padding: 0.75rem 1.5rem;
        background-color: #171717;
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition: background-color 0.3s;
      }

      .link:hover {
        background-color: #4f46e5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">4<span>0</span>4</p>
      <h1 class="heading">Page not found</h1>
      <p class="text">
        This page doesn't exist. Maybe it moved, or maybe I haven't built it
        yet.
      </p>
      <a href="/" class="link">Back home</a>
    </div>
  </body>
</html>
