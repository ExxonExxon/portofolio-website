<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern Spotify UI clone, demonstrating responsive design and interactive elements with Tailwind CSS and JavaScript.">
    <title>Tomas Gorjux | Spotify Clone</title>

    <meta property="og:title" content="Tomas Gorjux | Spotify Clone">
    <meta property="og:description" content="A modern Spotify UI clone, demonstrating responsive design and interactive elements with Tailwind CSS and JavaScript.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tomasgorjux.net/spotify-clone/index.html">
    <meta property="og:image" content="https://tomasgorjux.net/assets/scr-20260218-tzib.jpeg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tomas Gorjux | Spotify Clone">
    <meta name="twitter:description" content="A modern Spotify UI clone, demonstrating responsive design and interactive elements with Tailwind CSS and JavaScript.">
    <meta name="twitter:image" content="https://tomasgorjux.net/assets/scr-20260218-tzib.jpeg">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Spotify UI Clone by Tomas Gorjux",
      "url": "https://tomasgorjux.net/spotify-clone/index.html",
      "description": "An interactive and responsive recreation of the Spotify user interface, built using Tailwind CSS and vanilla JavaScript."
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700;900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2250%%22 x=%2250%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22900%22 font-size=%2275%22>TG</text></svg>">
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/80 z-40 hidden lg:hidden backdrop-blur-sm"></div>

    <div class="flex flex-1 overflow-hidden p-1 sm:p-2 gap-2 relative">

        <aside id="mobile-sidebar" class="fixed inset-y-0 left-0 w-[280px] sm:w-80 bg-black z-50 p-2 flex flex-col gap-2 -translate-x-full lg:relative lg:translate-x-0 lg:flex lg:bg-transparent">

            <nav class="bg-[#121212] rounded-xl p-4 space-y-4">
                <div class="flex items-center justify-between lg:hidden">
                    <span class="font-bold text-white">Navigation</span>
                    <button id="close-sidebar" class="p-2 text-zinc-400" aria-label="Close sidebar menu"><i data-lucide="x"></i></button>
                </div>
                <div class="flex items-center gap-4 text-white cursor-pointer font-bold hover:text-green-500 transition-colors">
                    <i data-lucide="home"></i> Home
                </div>
                <div class="flex items-center gap-4 text-zinc-400 hover:text-white transition-colors cursor-pointer font-bold" onclick="document.getElementById('main-search-input').focus(); if(window.innerWidth < 1024) toggleMenu();">
                    <i data-lucide="search"></i> Search
                </div>
            </nav>

            <div class="flex-1 bg-[#121212] rounded-xl p-2 flex flex-col overflow-hidden">
                <header class="flex items-center justify-between text-zinc-400 p-3 mb-2">
                    <div class="flex items-center gap-2 font-bold hover:text-white cursor-pointer transition-colors">
                        <i data-lucide="library" class="w-6 h-6"></i>
                        <span class="hidden sm:inline">Your Library</span>
                    </div>
                    <i data-lucide="plus" class="cursor-pointer hover:bg-zinc-800 rounded-full p-1.5 w-8 h-8"></i>
                </header>

                <div class="flex gap-2 px-3 mb-4 overflow-x-auto no-scrollbar">
                    <button class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap">Playlists</button>
                    <button class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap">Artists</button>
                    <button class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap">Albums</button>
                </div>

                <ul id="playlist-container" class="space-y-1 overflow-y-auto custom-scrollbar flex-1 px-1">
                </ul>

                <a href="https://tomas.gorjux.net" target="_blank" rel="noopener noreferrer"
                   class="block p-3 m-1 mt-auto bg-[#181818] hover:bg-[#282828] rounded-xl transition-all duration-300 cursor-pointer group active:scale-[0.98] border border-transparent hover:border-white/10">
                    <div class="flex items-center gap-3">
                        <i data-lucide="user" class="w-10 h-10 flex items-center justify-center text-green-400 rounded-full bg-zinc-700 shadow-lg p-2 shrink-0"></i>
                        <div class="min-w-0">
                            <p class="text-[9px] text-green-400 uppercase tracking-widest font-bold">Developer</p>
                            <p class="text-sm text-white font-bold truncate block group-hover:underline">Tomas Gorjux</p>
                        </div>
                        <i data-lucide="external-link" class="w-4 h-4 text-zinc-400 ml-auto opacity-0 group-hover:opacity-100 transition-opacity"></i>
                    </div>
                </a>
            </div>
        </aside>

        <main class="flex-1 bg-[#121212] rounded-xl overflow-y-auto spotify-gradient relative custom-scrollbar flex flex-col">
            <header class="sticky top-0 bg-[#121212]/80 backdrop-blur-xl p-3 sm:p-4 flex justify-between items-center z-30 border-b border-white/5">
                <div class="flex gap-3 items-center flex-1">
                    <button id="menu-btn" class="lg:hidden p-2 bg-black/60 rounded-full text-white" aria-label="Open sidebar menu" aria-expanded="false" aria-controls="mobile-sidebar"><i data-lucide="menu" class="w-5 h-5"></i></button>

                    <div class="hidden sm:flex gap-2">
                        <button class="bg-black/40 p-1.5 rounded-full text-zinc-400 hover:text-white" aria-label="Previous song"><i data-lucide="chevron-left"></i></button>
                        <button class="bg-black/40 p-1.5 rounded-full text-zinc-400 hover:text-white" aria-label="Next song"><i data-lucide="chevron-right"></i></button>
                    </div>

                    <div class="relative flex-1 max-w-md group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="w-4 h-4 text-zinc-400 group-focus-within:text-white"></i>
                        </div>
                        <input type="text" id="main-search-input"
                            placeholder="What's on your mind?"
                            class="w-full bg-[#242424] hover:bg-[#2a2a2a] focus:bg-[#2a2a2a] border border-transparent focus:border-zinc-500 rounded-full py-2 sm:py-2.5 pl-10 pr-10 text-xs sm:text-sm outline-none transition-all">
                        <button id="clear-search" class="absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-400 hover:text-white hidden">
                            <i data-lucide="circle-x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2 sm:gap-4 ml-2">
                    <button class="hidden md:block bg-white text-black px-5 py-2 rounded-full text-sm font-bold hover:scale-105 transition">Upgrade</button>
                    <button class="bg-black p-2 rounded-full border border-white/10 hover:border-zinc-500 transition"><i data-lucide="user" class="w-5 h-5 text-white"></i></button>
                </div>
            </header>

            <section class="p-4 sm:p-8">
                <div class="flex items-center justify-between mb-6">
                    <h1 id="greeting" class="text-2xl sm:text-3xl font-black tracking-tight">Good evening</h1>
                    <div id="search-count" class="text-[10px] font-bold text-green-500 uppercase tracking-widest hidden">Filtering...</div>
                </div>

                <ul id="album-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-3 sm:gap-6">
                </ul>
            </section>
        </main>
    </div>

    <footer class="h-20 sm:h-24 bg-black px-3 sm:px-4 flex items-center justify-between z-50">
        <div class="flex items-center gap-3 w-auto sm:w-1/3 min-w-0">
            <img id="player-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=120&h=120&fit=crop"
                class="w-10 h-10 sm:w-14 sm:h-14 rounded-md shadow-lg object-cover flex-shrink-0">
            <div class="truncate pr-2">
                <p id="player-title" class="text-xs sm:text-sm font-bold text-white hover:underline cursor-pointer truncate">Select a song</p>
                <p id="player-artist" class="text-[10px] sm:text-xs text-zinc-400 hover:text-white cursor-pointer truncate">Various Artists</p>
            </div>
            <button class="text-zinc-400 hover:text-green-500 transition-colors hidden sm:block">
                <i data-lucide="heart" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="flex flex-col items-center flex-1 max-w-[50%] sm:max-w-[40%] gap-1 sm:gap-2">
            <div class="flex items-center gap-4 sm:gap-6">
                <button class="text-zinc-500 hover:text-white hidden sm:block" aria-label="Shuffle songs"><i data-lucide="shuffle" class="w-4 h-4"></i></button>
                <button class="text-zinc-300 hover:text-white" aria-label="Previous track"><i data-lucide="skip-back" class="w-5 h-5 sm:w-6 sm:h-6 fill-current"></i></button>
                <button id="master-play" class="bg-white text-black p-2 sm:p-2.5 rounded-full hover:scale-110 active:scale-95 transition play-btn-shadow" aria-label="Play current song">
                    <i data-lucide="play" id="master-icon" class="w-5 h-5 sm:w-6 sm:h-6 fill-current"></i>
                </button>
                <button class="text-zinc-300 hover:text-white" aria-label="Next track"><i data-lucide="skip-forward" class="w-5 h-5 sm:w-6 sm:h-6 fill-current"></i></button>
                <button class="text-zinc-500 hover:text-white hidden sm:block" aria-label="Repeat current song"><i data-lucide="repeat" class="w-4 h-4"></i></button>
            </div>
            <div class="flex items-center gap-2 w-full max-w-md">
                <span class="text-[9px] sm:text-[10px] text-zinc-500 font-bold min-w-[25px] text-right">1:24</span>
                <div class="h-1 flex-1 bg-zinc-800 rounded-full cursor-pointer group relative">
                    <div class="h-full bg-white group-hover:bg-green-500 w-1/3 rounded-full transition-colors"></div>
                    <div class="absolute top-1/2 left-1/3 -translate-y-1/2 w-3 h-3 bg-white rounded-full opacity-0 group-hover:opacity-100 shadow-xl"></div>
                </div>
                <span class="text-[9px] sm:text-[10px] text-zinc-500 font-bold min-w-[25px]">3:45</span>
            </div>
        </div>

        <div class="hidden lg:flex items-center justify-end gap-4 w-1/3">
            <button class="text-zinc-400 hover:text-white" aria-label="Open song queue"><i data-lucide="list-music" class="w-4 h-4"></i></button>
            <div class="flex items-center gap-2 group w-24">
                <i data-lucide="volume-2" class="w-4 h-4 text-zinc-400 group-hover:text-white" aria-label="Volume control"></i>
                <div class="h-1 flex-1 bg-zinc-800 rounded-full overflow-hidden">
                    <div class="h-full bg-white group-hover:bg-green-500 w-2/3"></div>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/scripts/spotify.js"></script>
</body>
</html>
